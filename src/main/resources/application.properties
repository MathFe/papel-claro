spring.application.name=papel-claro

# Which Gemma to use. Override without touching this file:
#   Windows PowerShell:  $env:GEMMA_MODEL="gemma4:12b"
app.model=${GEMMA_MODEL:gemma3:4b}

# --- Ollama (local inference) ---
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}

# Spring AI 2.x reads these keys directly under "chat" ("chat.options.*" still works but is deprecated).
spring.ai.ollama.chat.model=${app.model}

# Low temperature: we want the document's facts, not creativity.
spring.ai.ollama.chat.temperature=0.2

# Room for a few pages of contract plus the answer.
spring.ai.ollama.chat.num-ctx=8192

# Ask Ollama for JSON so the answer can be turned into Java records.
spring.ai.ollama.chat.format=json

# Spring AI retries failed calls up to 10 times with a growing wait. With Ollama closed that
# leaves the person staring at the screen for minutes, so fail at once and show the message.
spring.ai.retry.max-attempts=1

# --- Uploads (photo of the document) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# Keep uploads in memory: by default every upload is written to a temporary file on disk.
spring.servlet.multipart.file-size-threshold=12MB

# Never write request details to the log: documents are private.
logging.level.org.springframework.ai=WARN
